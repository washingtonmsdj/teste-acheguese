name: protected-release-smoke
run-name: protected smoke ${{ inputs.base_url }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Exact protected Vercel candidate URL
        required: true
        type: string
      expect_territory_public:
        description: Expected territory rollout visibility
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  contents: read
  id-token: write

concurrency:
  group: protected-release-smoke-${{ inputs.base_url }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_URL: ${{ inputs.base_url }}
      EXPECT_TERRITORY_PUBLIC: ${{ inputs.expect_territory_public }}
      REQUIRE_VERCEL_TRUSTED_OIDC: '1'

    steps:
      - name: Require canonical main ref
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Protected release smoke must run from main"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Issue short-lived GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Run protected release smoke
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node scripts/territory-release-smoke.mjs
