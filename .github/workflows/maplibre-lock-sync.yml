name: maplibre-lock-sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/maplibre-lock-sync.yml"

permissions:
  contents: write

concurrency:
  group: maplibre-lock-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact MapLibre dependency
        run: npm install maplibre-gl@6.7.0 --save-exact --ignore-scripts --no-audit --no-fund

      - name: Commit canonical lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: pin MapLibre GL JS 6.7.0"
          git push origin HEAD:main
