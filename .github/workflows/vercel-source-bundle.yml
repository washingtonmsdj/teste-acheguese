name: vercel-source-bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-source-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate Vercel files payload
        run: >-
          python scripts/ci/build-vercel-source-bundle.py
          --output /tmp/vercel-files.json

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build Vercel files payload
        run: >-
          python scripts/ci/build-vercel-source-bundle.py
          --output /tmp/vercel-files.json

      - name: Publish transport branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "acheguese-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan deploy-vercel-bundle
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/vercel-files.json vercel-files.json
          printf '%s\n' "$SOURCE_SHA" > SOURCE_SHA
          git add vercel-files.json SOURCE_SHA
          git commit -m "chore: refresh Vercel transport bundle"
          git push --force origin HEAD:refs/heads/deploy/vercel-bundle
